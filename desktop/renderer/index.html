<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP 收紧到「只有同源脚本」：模型输出会经 markdown.js 变成 innerHTML，
      虽然那边已经先转义了，但再多一层兜底不亏。`unsafe-inline` 只留给样式。
      注意 `default-src 'none'` 把 font-src 也挡死了 —— 所以只能用系统字体，
      别指望引外链字体。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>clauda</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      `data-view` 是整块布局的开关（见 style.css 的 `.app[data-view=…]`）。
      初始值必须和 state.js 的 `createState().view` 一致，否则首帧会先按错的
      列宽排一遍再跳回来。
    -->
    <div class="app" id="app" data-view="sessions">
      <!--
        左侧只有这一栏：身份 / 动作 → 主导航 → 当前项目与会话列表。

        导航条（模型 / 技能 / MCP / 会话）早先是独立的一窄条，只有 76px 宽、标签
        压在徽标上方。它和会话列表其实是同一件事的两半 —— 「看哪个视图」和「看哪个
        会话」都在这一列里点，分成两栏只是多一道竖线、再让每项少掉一半可用宽度。
      -->
      <aside class="sidebar">
        <header class="sidebar-head">
          <span class="brand">clauda</span>
        </header>

        <!--
          导航条同时是「状态脊」：每一项自带一个实时徽标（会话数 / 当前模型 /
          技能数 / 智能体数 / MCP 已连接数）。这些是后台状态，不该逼用户点进去才知道。

          会话视图下这里只有「会话」一项。四个设置项是**另一套左栏内容**，点底部的
          「设置」才换上（见 `#settings-group`）—— 换上时这一格和下面的会话列表一起让位。
        -->
        <nav class="rail" id="rail" aria-label="主导航">
          <!--
            会话排在最上面、且紧挨着下面那张会话列表：进应用第一眼就是它。这一格的徽标
            是进行中的会话数。
          -->
          <button type="button" class="rail-item" id="nav-sessions">
            <span class="rail-label">会话</span>
            <span class="rail-badge mono" id="badge-sessions"></span>
          </button>
        </nav>

        <!--
          设置四项。点开「设置」之后**整块左栏换成它** —— 会话那一格和下面的会话列表
          同时让位（用户的原话是「点击设置 隐藏会话相关内容」）。

          所以它排在 `.browse` **上面**：换上去之后它就是左栏的第一块内容，接的正是
          原来「会话」那一格的位置。底部的「设置」只是个开关，不再是这四个的容器 ——
          所以这里也不缩进、不画左侧竖线。
        -->
        <div class="rail-group" id="settings-group" hidden>
          <!--
            智能体排在最前面：它是唯一一项「描述整段对话」的配置，模型/技能/工具
            都只是它参考的素材。把它压在模型上面，也是用户指定的位置。
          -->
          <button type="button" class="rail-item" id="nav-agents">
            <span class="rail-label">智能体</span>
            <span class="rail-badge mono" id="badge-agents"></span>
          </button>
          <button type="button" class="rail-item" id="nav-model">
            <span class="rail-label">模型</span>
            <span class="rail-badge mono" id="badge-model"></span>
          </button>
          <button type="button" class="rail-item" id="nav-skills">
            <span class="rail-label">技能</span>
            <span class="rail-badge" id="badge-skills"></span>
          </button>
          <button type="button" class="rail-item" id="nav-mcp">
            <span class="rail-label">工具</span>
            <span class="rail-badge" id="badge-mcp"></span>
          </button>
        </div>

        <!--
          会话浏览区。**只在会话视图下在**：点开「设置」之后整块让位给上面那四项。

          它一度想五个视图下都常驻，理由是「换一份配置、马上找个会话来试」该是一步。
          但设置页上真正要点的东西在中栏和右栏，把「项目目录 / 新会话 / 一长串会话」
          留在左边，只会把该看的那四个设置项挤到看不见。要试新配置，点「会话」回去
          就行 —— 那一下本来就要点，因为换回会话视图正是它的语义（`showSessions()`）。
        -->
        <div class="browse" id="browse">
          <label class="project-picker">
            <span>项目目录</span>
            <button id="pick-project" class="ghost small">选择…</button>
          </label>
          <div id="project-path" class="project-path"></div>
          <!--
            「新会话」贴在这一列会话的顶上，而不是品牌那一行：它属于**这个项目**的会话
            列表，不是属于整个窗口，放这儿之后「在哪个项目里新建」一目了然，不必回头去
            看上面那行路径。
            它和会话行一样，点完会把中栏换回对话（`showSessions()`）—— 造一个新的出来
            当然是给你看的，留在设置页上会显得这一下没生效。
          -->
          <!--
            「用哪个智能体」这一格**只在开新会话时点得动** —— 这是「会话创建那一刻定下来」
            这条决策在界面上的落点。选项由 `renderNewSessionAgent()` 现填，默认落在
            本项目默认的那个上；没有默认就落在「（不用智能体）」。

            它**总是带一个具体值**（没选就发空串），所以主进程那条「没给名字就套项目默认」
            的隐患在这条路径上根本不成立。
          -->
          <select id="new-session-agent" class="new-session-agent" aria-label="新会话使用哪个智能体"></select>
          <button id="new-session" class="new-session" title="在选中的项目里新建会话">＋ 新会话</button>
          <div id="session-list" class="session-list"></div>
        </div>

        <!--
          设置停靠区：整个左栏只有这一个按钮钉在窗口最底下。点它把上面的内容在
          「会话」和「设置四项」之间换一次 —— 它现在是个开关，不是展开器。

          靠 `margin-top: auto` 而不是 `.browse` 的 `flex: 1` 顶到底：点开「设置」
          之后 `.browse` 就 `hidden` 了，还指望它把这一块顶下去的话，按钮会跟着往上跑。
        -->
        <div class="settings-dock">
          <button
            type="button"
            class="rail-item"
            id="nav-settings"
            aria-expanded="false"
            aria-controls="settings-group"
          >
            <span class="rail-label">设置</span>
            <span class="rail-caret" aria-hidden="true"></span>
          </button>
        </div>

      </aside>

      <main class="chat">
        <!--
          `stream` 和下面那些 id 必须原样留着，而且不能改它们的父节点 ——
          tests/renderer-dom.mjs 会按 id 取到节点再按下标遍历子节点。
        -->
        <div class="view" id="view-sessions">
          <header class="topbar">
            <!--
              标题和「这个会话绑的智能体」并成一组。**不能**把 `#chat-agent` 直接挂到
              `.topbar` 上：那是个 `space-between` 的两列 flex，多一个孩子会把中栏的
              控件整排挤歪。
            -->
            <div class="topbar-left">
              <div class="topbar-title" id="chat-title">还没有打开的会话</div>
              <!--
                显示的是**这一个会话**绑的智能体，不是「项目的默认智能体」——
                同一个项目下两个会话可以绑两个不同的智能体。没有绑定时整格藏起来。
              -->
              <span class="chat-agent mono" id="chat-agent" hidden></span>
            </div>
            <div class="topbar-controls">
              <label class="control">
                <span>模型</span>
                <input id="model-input" type="text" spellcheck="false" placeholder="模型名" />
              </label>
              <label class="control">
                <span>模式</span>
                <select id="mode-select">
                  <option value="default">default</option>
                  <option value="auto">auto</option>
                  <option value="plan">plan</option>
                </select>
              </label>
              <div class="control context">
                <span>上下文</span>
                <div class="context-bar" title="上下文占用"><i id="context-fill"></i></div>
              </div>
            </div>
          </header>

          <div id="stream" class="stream"></div>

          <!--
            新会话空态：这个智能体配好的「常见问题」，点一条就当作发出去。

            **为什么不塞进 `#stream` 里**：`renderStream` 靠
            `while (streamNodes.length > items.length) els.stream.lastElementChild.remove()`
            收尾，多一个尾巴上来的节点会被它当成多余的消息节点删掉。放在同级、
            由 `renderEmptyQuestions()` 自己管显示与否，`#stream` 那套被测试钉住的
            DOM 契约一个字都不用动。
          -->
          <div id="empty-questions" class="empty-questions" hidden></div>

          <form id="composer" class="composer">
            <!--
              待发附件。`.composer` 是 `flex-wrap: wrap` 的，这一条靠 `flex-basis: 100%`
              独占一行，textarea 和按钮留在下一行 —— 所以这里只是**多一个子节点**，
              textarea 的父节点没变（上面那条注释禁的就是换父节点）。
            -->
            <div id="attach-list" class="attach-list" hidden></div>
            <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
            <div class="composer-actions">
              <button type="button" id="attach" class="ghost" title="选择文件作为附件">附件</button>
              <button type="button" id="abort" class="ghost" hidden>停止</button>
              <button type="submit" id="send">发送</button>
            </div>
          </form>
        </div>

        <!-- 智能体 / 模型 / 技能 / 工具四个设置页共用这一个容器，内容由 app.js 现画 -->
        <div class="view" id="view-settings" hidden>
          <header class="settings-head">
            <h1 class="settings-title" id="settings-title"></h1>
            <p class="settings-sub" id="settings-sub"></p>
          </header>
          <div class="settings-body" id="settings-body"></div>
        </div>
      </main>

      <aside class="panel">
        <section class="panel-block">
          <h2>改动文件</h2>
          <ul id="changed-files" class="plain"></ul>
        </section>
        <section class="panel-block">
          <h2>待办</h2>
          <ul id="todos" class="plain"></ul>
        </section>
      </aside>

      <!--
        通知栏是 `.app` 网格的第二行（见 style.css），四个视图下都看得见。
        它早先是侧栏底部的一条，而侧栏在模型/技能/MCP 三个设置页上是 `display:none`，
        于是「MCP 开关接不上」这类错误恰好死在引发它的那个页面上，一个字都看不到。
      -->
      <div id="notices" class="notices"></div>

      <!--
        整窗拖拽遮罩。`position: fixed` 让它脱离文档流，所以不会参与 `.app` 的网格
        排布（那张网格每个子元素都写死了 grid-column，多一个没定位的就会挤出一行）。
        样式里必须带 `pointer-events: none`，否则遮罩自己会把 drop 事件吃掉。
      -->
      <div id="drop-hint" class="drop-hint" hidden>松开即添加为附件</div>
    </div>

    <div id="modal-host" class="modal-host" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
